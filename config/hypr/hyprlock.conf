$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 0
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = /home/alan/Media/Pictures/Wallpapers/1.png
    blur_passes = 2
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(30, 30, 46, 0.5) 

    outer_color = rgba(137, 180, 250, 1.0)
    check_color = rgba(a6e3a1ee) rgba(94e2d5ee) 120deg
    fail_color = rgba(f38ba8ee) rgba(eba0accc) 40deg

    font_color = rgb(205, 214, 244)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL$FPRINTFAIL

    # check_text = Authenticating...
    # dots_text_format = *
    # dots_size = 0.4
    # hide_input = true

    dots_spacing = 0.3

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME # ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#variable-substitution
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

label {
    monitor =
    text = $LAYOUT[en,ru]
    font_size = 24
    onclick = hyprctl switchxkblayout all next

    position = 250, -20
    halign = center
    valign = center
}


# for more configuration options, refer https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock
# rendered text in all widgets supports pango markup (e.g. <b> or <i> tags)
# ref. https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock/#general-remarks
# shortcuts to clear password buffer: ESC, Ctrl+U, Ctrl+Backspace
# you can get started by copying this config to ~/.config/hypr/hyprlock.conf