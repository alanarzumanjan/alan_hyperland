# Catppuccin Mocha

shell /usr/bin/fish

font_family JetBrainsMono Nerd Font
font_size 12

bold_font auto
italic_font auto

window_padding_width 10

background_opacity 0.9

hide_window_decorations yes

cursor_shape beam
cursor_blink_interval 0.6

scrollback_lines 100000

enable_audio_bell no

background #11111b
foreground #cdd6f4

selection_background #313244
selection_foreground #cdd6f4

cursor #f5e0dc

color0 #181825
color1 #f38ba8
color2 #a6e3a1
color3 #f9e2af
color4 #89b4fa
color5 #cba6f7
color6 #94e2d5
color7 #bac2de

color8 #313244
color9 #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #cba6f7
color14 #94e2d5
color15 #ffffff

window_padding_x 45
window_padding_y 45
